<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 LEVEL UP 🎮</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  padding: 15px;
  color: #fff;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,0,0,.2), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,0,0,.15), transparent 35%),
    #050505;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 6vw, 48px);
  margin: 15px 0 25px;
  color: #ff0000;
  text-shadow: 0 0 15px #ff0000;
}

.room {
  background: rgba(20,20,20,.95);
  border: 1px solid #ff0000;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.room h2 {
  font-size: 21px;
  margin-bottom: 12px;
}

.price {
  color: #ff7777;
  margin-bottom: 15px;
}

.start-label {
  display: block;
  margin: 12px 0 8px;
  color: #ddd;
  font-size: 14px;
}

.start-time {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ff0000;
  background: #111;
  color: white;
  font-size: 16px;
  direction: ltr;
  color-scheme: dark;
}

.timer {
  text-align: center;
  font-size: clamp(28px, 7vw, 40px);
  font-weight: bold;
  color: #00ff99;
  margin: 15px 0;
  direction: ltr;
  font-variant-numeric: tabular-nums;
}

.status {
  text-align: center;
  color: #aaa;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 12px 8px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #008f55;
}

.stop {
  background: #ff0000;
}

button:disabled,
.start-time:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.result {
  margin-top: 14px;
  color: #00ff99;
  line-height: 1.9;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.history {
  margin-top: 18px;
  border-top: 1px solid #333;
  padding-top: 12px;
}

.history-title {
  color: #ff7777;
  margin-bottom: 12px;
  font-weight: bold;
}

.history-item {
  background: #1a1a1a;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 9px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.empty {
  color: #777;
  font-size: 14px;
}
