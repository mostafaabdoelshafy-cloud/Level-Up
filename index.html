<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 LEVEL UP 🎮</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  padding: 15px;
  color: #fff;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,0,0,.2), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,0,0,.15), transparent 35%),
    #050505;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 6vw, 48px);
  margin: 15px 0 25px;
  color: #ff0000;
  text-shadow: 0 0 15px #ff0000;
}

/* شاشة تسجيل الدخول */
#loginOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(5, 5, 5, 0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-box {
  background: #141414;
  border: 2px solid #ff0000;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  width: 90%;
  max-width: 350px;
}

.login-box h2 {
  color: #ff0000;
  margin-bottom: 15px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ff0000;
  background: #111;
  color: white;
  font-size: 16px;
  text-align: center;
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: #008f55;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.room {
  background: rgba(20,20,20,.95);
  border: 1px solid #ff0000;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.room h2 {
  font-size: 21px;
  margin-bottom: 12px;
}

.price {
  color: #ff7777;
  margin-bottom: 15px;
}

.start-label {
  display: block;
  margin: 12px 0 8px;
  color: #ddd;
  font-size: 14px;
}

.start-time {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ff0000;
  background: #111;
  color: white;
  font-size: 16px;
  direction: ltr;
  color-scheme: dark;
}

.timer {
  text-align: center;
  font-size: clamp(28px, 7vw, 40px);
  font-weight: bold;
  color: #00ff99;
  margin: 10px 0 5px;
  direction: ltr;
  font-variant-numeric: tabular-nums;
}

.live-amount {
  text-align: center;
  font-size: 18px;
  color: #ffcc00;
  margin-bottom: 12px;
  font-weight: bold;
}

.status {
  text-align: center;
  color: #aaa;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 12px 8px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #008f55;
}

.stop {
  background: #ff0000;
}

button:disabled,
.start-time:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.history {
  margin-top: 18px;
  border-top: 1px solid #333;
  padding-top: 12px;
}

.history-title {
  color: #ff7777;
  margin-bottom: 12px;
  font-weight: bold;
}

.history-item {
  position: relative;
  background: #1a1a1a;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 9px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

/* زر حذف الجلسة */
.delete-btn {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #d9534f;
  color: white;
  border: none;
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
  width: auto;
  flex: none;
}

.delete-btn:hover {
  background: #c9302c;
}

.empty {
  color: #777;
  font-size: 14px;
}

.total-box {
  background: #111;
  border: 2px solid #ff0000;
  padding: 20px 10px;
  border-radius: 15px;
  text-align: center;
  font-size: 22px;
  color: #00ff99;
  font-weight: bold;
  margin: 20px 0;
}

.total-box small {
  display: block;
  color: #aaa;
  font-size: 12px;
  font-weight: normal;
  margin-top: 10px;
}

.shift-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #b22222;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 20px;
  text-align: center;
}

.shifts-history-box {
  background: rgba(15,15,15,.95);
  border: 1px solid #444;
  border-radius: 15px;
  padding: 18px;
  margin-top: 30px;
}

.shifts-history-box h3 {
  color: #ff7777;
  margin-bottom: 12px;
}
</style>

<!-- استدعاء مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒 تسجيل الدخول</h2>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    <button onclick="checkPassword()">دخول</button>
  </div>
</div>

<h1>🎮 LEVEL UP 🎮</h1>

<button class="shift-btn" onclick="resetShift()">🔄 إغلاق الوردية وحفظ التقرير وتصفير الأرباح</button>

<div id="rooms"></div>

<div class="total-box">
  💰 إجمالي الأرباح الحالية
  <div><span id="grandTotal">0.00</span> جنيه</div>
  <small>إجمالي الجلسات الحالية قبل إغلاق الوردية</small>
</div>

<div class="shifts-history-box">
  <h3>📋 تقارير الورديات السابقة المسجلة</h3>
  <div id="shiftsHistoryContainer">
    <div class="empty">لا توجد ورديات مسجلة حتى الآن.</div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "LevellUp2";

function checkPassword() {
  const pass = document.getElementById("passwordInput").value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById("loginOverlay").style.display = "none";
    sessionStorage.setItem("loggedIn", "true");
  } else {
    alert("كلمة المرور غير صحيحة!");
  }
}

window.onload = function() {
  if (sessionStorage.getItem("loggedIn") === "true") {
    document.getElementById("loginOverlay").style.display = "none";
  }
};

const firebaseConfig = {
  apiKey: "AIzaSyBGDsQYq_ry3hx56Ezhpn2Gy5kGaeUCGQE",
  authDomain: "level-up-63005.firebaseapp.com",
  databaseURL: "https://level-up-63005-default-rtdb.firebaseio.com",
  projectId: "level-up-63005",
  storageBucket: "level-up-63005.firebasestorage.app",
  messagingSenderId: "888608963497",
  appId: "1:888608963497:web:6c4ab76087e24fdfc662b8",
  measurementId: "G-W8E5T2X7FB"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref("levelUpData");

const roomData = [
  { name: "🎮 Room 1", price: 100 },
  { name: "🎮 Room 2", price: 100 },
  { name: "🎮 Room 3", price: 120 },
  { name: "🎮 Room 4", price: 200 },
  { name: "🎮 Room 5", price: 80 },
  { name: "🎱 Billiards", price: 80 }
];

let data = {
  totals: [0, 0, 0, 0, 0, 0],
  histories: [[], [], [], [], [], []],
  active: [null, null, null, null, null, null],
  shiftsHistory: []
};

const roomsContainer = document.getElementById("rooms");

function money(value) {
  return Number(value || 0).toFixed(2);
}

function formatDuration(ms) {
  let seconds = Math.floor(ms / 1000);
  const hours = Math.floor(seconds / 3600);
  seconds %= 3600;
  const minutes = Math.floor(seconds / 60);
  seconds %= 60;
  return [hours, minutes, seconds].map(n => String(n).padStart(2, "0")).join(":");
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString("ar-EG");
}

function elapsed(room) {
  const session = data.active && data.active[room];
  return session ? Math.max(0, Date.now() - session.start) : 0;
}

roomData.forEach((room, index) => {
  const card = document.createElement("div");
  card.className = "room";
  card.innerHTML = `
    <h2>${room.name}</h2>
    <div class="price">${room.price} جنيه / ساعة</div>
    <label class="start-label" for="startTime${index}">⏰ حدد وقت بداية التايم (اختياري):</label>
    <input type="time" class="start-time" id="startTime${index}" step="1">
    <div class="status" id="status${index}">الجلسة متوقفة</div>
    <div class="timer" id="timer${index}">00:00:00</div>
    <div class="live-amount" id="liveAmount${index}">المبلغ الحالي: 0.00 جنيه</div>
    <div class="buttons">
      <button class="start" id="start${index}" onclick="startTimer(${index})">▶️ ابدأ التايم</button>
      <button class="stop" id="stop${index}" onclick="stopTimer(${index})" disabled>⏹️ إنهاء التايم</button>
    </div>
    <div class="history">
      <div class="history-title">📋 سجل الجلسات</div>
      <div id="history${index}"></div>
    </div>
  `;
  roomsContainer.appendChild(card);
});

function saveData() {
  dbRef.set(data).catch(error => {
    alert("تعذر حفظ البيانات في السحابة: " + error.message);
  });
}

dbRef.on("value", (snapshot) => {
  const val = snapshot.val();
  if (val) {
    data.totals = val.totals || [0, 0, 0, 0, 0, 0];
    data.histories = val.histories ? val.histories.map(h => h || []) : [[], [], [], [], [], []];
    data.active = val.active || [null, null, null, null, null, null];
    data.shiftsHistory = val.shiftsHistory || [];
  }
  renderAll();
}, (error) => {
  console.error("Firebase Error: ", error);
  renderAll();
});

function startTimer(room) {
  if (data.active && data.active[room]) {
    alert("العداد شغال بالفعل في هذه الغرفة!");
    return;
  }

  const input = document.getElementById("startTime" + room);
  const now = new Date();
  let start = Date.now();

  if (input && input.value) {
    const parts = input.value.split(":").map(Number);
    const hours = parts[0];
    const minutes = parts[1];
    const seconds = parts[2] || 0;

    if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) {
      alert("اختار توقيت صحيح!");
      return;
    }

    const selected = new Date(now);
    selected.setHours(hours, minutes, seconds, 0);
    start = selected.getTime();

    if (start > Date.now()) {
      alert("وقت البداية مينفعش يكون في المستقبل!");
      return;
    }
  }

  if (!data.active) {
    data.active = [null, null, null, null, null, null];
  }

  data.active[room] = { start: start };
  saveData();
}

function stopTimer(room) {
  const session = data.active && data.active[room];
  if (!session || !session.start) {
    alert("برجاء التأكد من بدء التايم لهذه الغرفة أولاً!");
    return;
  }

  const end = Date.now();
  const duration = Math.max(0, end - session.start);
  let rawTotal = (duration / 3600000) * roomData[room].price;

  let discountInput = prompt(`المبلغ الإجمالي بدون خصم هو: ${money(rawTotal)} جنيه.\nأدخل قيمة الخصم (بالجنيه) إن وجدت، أو اتركها 0:`, "0");
  let discount = parseFloat(discountInput) || 0;
  
  if (discount < 0) discount = 0;
  let finalTotal = Math.max(0, rawTotal - discount);

  const record = {
    id: Date.now() + "_" + Math.random().toString(36).substr(2, 4),
    start: session.start,
    end: end,
    duration: duration,
    rawAmount: rawTotal,
    discount: discount,
    amount: finalTotal
  };

  if (!data.histories[room]) {
    data.histories[room] = [];
  }

  data.histories[room].unshift(record);
  data.totals[room] = (data.totals[room] || 0) + finalTotal;
  data.active[room] = null;

  saveData();
  renderAll();
}

// دالة حذف جلسة مسجلة بالخطأ
function deleteRecord(room, recordId) {
  const historyList = data.histories[room] || [];
  const index = historyList.findIndex(r => r.id === recordId || (r.start === recordId)); // دعم المعرف القديم والجديد

  if (index !== -1) {
    const record = historyList[index];
    if (confirm(`هل أنت متأكد من حذف هذه الجلسة بقيمة ${money(record.amount)} جنيه؟`)) {
      // خصم المبلغ من إجمالي الغرفة
      data.totals[room] = Math.max(0, (data.totals[room] || 0) - record.amount);
      
      // حذف الجلسة من السجل
      data.histories[room].splice(index, 1);

      saveData();
      renderAll();
      alert("تم حذف الجلسة وتحديث الحسابات بنجاح!");
    }
  }
}

function resetShift() {
  const sum = (data.totals || []).reduce((a, b) => a + b, 0);
  if (confirm(`إجمالي الأرباح الحالية للوردية هو ${money(sum)} جنيه.\nهل أنت متأكد من إغلاق الوردية، حفظ التقرير، وتصفير العدادات؟`)) {
    
    const shiftReport = {
      date: Date.now(),
      totalAmount: sum
    };

    if (!data.shiftsHistory) {
      data.shiftsHistory = [];
    }
    data.shiftsHistory.unshift(shiftReport);

    data.totals = [0, 0, 0, 0, 0, 0];
    saveData();
    renderAll();
    alert("تم إغلاق الوردية وحفظ التقرير بنجاح!");
  }
}

function renderRoom(room) {
  const active = data.active && data.active[room];

  const startBtn = document.getElementById("start" + room);
  const stopBtn = document.getElementById("stop" + room);
  const timeInput = document.getElementById("startTime" + room);

  if (startBtn) startBtn.disabled = !!active;
  if (stopBtn) stopBtn.disabled = !active;
  if (timeInput) timeInput.disabled = !!active;

  const statusEl = document.getElementById("status" + room);
  if (statusEl) {
    statusEl.textContent = active ? "🟢 الجلسة شغالة الآن" : "الجلسة متوقفة";
  }

  const timerEl = document.getElementById("timer" + room);
  const liveAmountEl = document.getElementById("liveAmount" + room);

  if (timerEl) {
    timerEl.textContent = active ? formatDuration(elapsed(room)) : "00:00:00";
  }

  if (liveAmountEl) {
    if (active) {
      let currentDuration = elapsed(room);
      let currentAmount = (currentDuration / 3600000) * roomData[room].price;
      liveAmountEl.textContent = `المبلغ الحالي: ${money(currentAmount)} جنيه`;
    } else {
      liveAmountEl.textContent = "المبلغ الحالي: 0.00 جنيه";
    }
  }

  const historyElement = document.getElementById("history" + room);
  if (!historyElement) return;

  historyElement.replaceChildren();
  const historyList = data.histories[room] || [];

  if (!historyList.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "لا توجد جلسات مسجلة حتى الآن.";
    historyElement.appendChild(empty);
    return;
  }

  historyList.forEach(record => {
    const item = document.createElement("div");
    item.className = "history-item";

    const recordId = record.id || record.start;

    // إضافة زر الحذف
    const delBtn = document.createElement("button");
    delBtn.className = "delete-btn";
    delBtn.textContent = "🗑️ حذف";
    delBtn.onclick = () => deleteRecord(room, recordId);
    item.appendChild(delBtn);

    let lines = [
      "📅 " + formatDate(record.start),
      "▶️ البداية: " + new Date(record.start).toLocaleTimeString("ar-EG"),
      "⏹️ النهاية: " + new Date(record.end).toLocaleTimeString("ar-EG"),
      "⏳ المدة: " + formatDuration(record.duration)
    ];

    if (record.discount && record.discount > 0) {
      lines.push("🏷️ الخصم: " + money(record.discount) + " جنيه");
    }
    lines.push("💰 المبلغ النهائي: " + money(record.amount) + " جنيه");

    lines.forEach((line, i) => {
      if (i > 0) item.appendChild(document.createElement("br"));
      item.appendChild(document.createTextNode(line));
    });

    historyElement.appendChild(item);
  });
}

function renderShiftsHistory() {
  const container = document.getElementById("shiftsHistoryContainer");
  if (!container) return;

  container.replaceChildren();
  const shifts = data.shiftsHistory || [];

  if (!shifts.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "لا توجد ورديات مسجلة حتى الآن.";
    container.appendChild(empty);
    return;
  }

  shifts.forEach((shift, index) => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.innerHTML = `📌 <strong>وردية رقم (${shifts.length - index})</strong><br>
      📅 تاريخ الإغلاق: ${formatDate(shift.date)}<br>
      💰 إجمالي إيرادات الوردية: <strong>${money(shift.totalAmount)} جنيه</strong>`;
    container.appendChild(item);
  });
}

function updateTotal() {
  const sum = (data.totals || []).reduce((a, b) => a + b, 0);
  const grandTotalEl = document.getElementById("grandTotal");
  if (grandTotalEl) {
    grandTotalEl.textContent = money(sum);
  }
}

function updateTimers() {
  roomData.forEach((room, index) => {
    if (data.active && data.active[index]) {
      const timerEl = document.getElementById("timer" + index);
      const liveAmountEl = document.getElementById("liveAmount" + index);
      
      if (timerEl) {
        timerEl.textContent = formatDuration(elapsed(index));
      }
      if (liveAmountEl) {
        let currentDuration = elapsed(index);
        let currentAmount = (currentDuration / 3600000) * roomData[index].price;
        liveAmountEl.textContent = `المبلغ الحالي: ${money(currentAmount)} جنيه`;
      }
    }
  });
}

function renderAll() {
  roomData.forEach((room, index) => {
    renderRoom(index);
  });
  updateTotal();
  renderShiftsHistory();
  updateTimers();
}

setInterval(updateTimers, 1000);
</script>

</body>
</html>
