<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 LEVEL UP 🎮</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  padding: 15px;
  color: #fff;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,0,0,.2), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,0,0,.15), transparent 35%),
    #050505;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 6vw, 48px);
  margin: 15px 0 25px;
  color: #ff0000;
  text-shadow: 0 0 15px #ff0000;
}

.room {
  background: rgba(20,20,20,.95);
  border: 1px solid #ff0000;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.room h2 {
  font-size: 21px;
  margin-bottom: 12px;
}

.price {
  color: #ff7777;
  margin-bottom: 15px;
}

.start-label {
  display: block;
  margin: 12px 0 8px;
  color: #ddd;
  font-size: 14px;
}

.start-time {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ff0000;
  background: #111;
  color: white;
  font-size: 16px;
  direction: ltr;
  color-scheme: dark;
}

.timer {
  text-align: center;
  font-size: clamp(28px, 7vw, 40px);
  font-weight: bold;
  color: #00ff99;
  margin: 15px 0;
  direction: ltr;
  font-variant-numeric: tabular-nums;
}

.status {
  text-align: center;
  color: #aaa;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 12px 8px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #008f55;
}

.stop {
  background: #ff0000;
}

button:disabled,
.start-time:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.result {
  margin-top: 14px;
  color: #00ff99;
  line-height: 1.9;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.history {
  margin-top: 18px;
  border-top: 1px solid #333;
  padding-top: 12px;
}

.history-title {
  color: #ff7777;
  margin-bottom: 12px;
  font-weight: bold;
}

.history-item {
  background: #1a1a1a;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 9px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.empty {
  color: #777;
  font-size: 14px;
}

.total-box {
  background: #111;
  border: 2px solid #ff0000;
  padding: 20px 10px;
  border-radius: 15px;
  text-align: center;
  font-size: 22px;
  color: #00ff99;
  font-weight: bold;
  margin: 20px 0;
}

.total-box small {
  display: block;
  color: #aaa;
  font-size: 12px;
  font-weight: normal;
  margin-top: 10px;
}
</style>

<!-- استدعاء مكتبات Firebase المتوافقة مع الكود -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<h1>🎮 LEVEL UP 🎮</h1>

<div id="rooms"></div>

<div class="total-box">
  💰 إجمالي الأرباح
  <div><span id="grandTotal">0.00</span> جنيه</div>
  <small>إجمالي الجلسات المسجلة والمكتملة</small>
</div>

<script>
// إعدادات مشروعك الخاصة على Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBGDsQYq_ry3hx56Ezhpn2Gy5kGaeUCGQE",
  authDomain: "level-up-63005.firebaseapp.com",
  databaseURL: "https://level-up-63005-default-rtdb.firebaseio.com",
  projectId: "level-up-63005",
  storageBucket: "level-up-63005.firebasestorage.app",
  messagingSenderId: "888608963497",
  appId: "1:888608963497:web:6c4ab76087e24fdfc662b8",
  measurementId: "G-W8E5T2X7FB"
};

// تهيئة Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref("levelUpData");

const roomData = [
  { name: "🎮 Room 1", price: 100 },
  { name: "🎮 Room 2", price: 100 },
  { name: "🎮 Room 3", price: 120 },
  { name: "🎮 Room 4", price: 200 },
  { name: "🎮 Room 5", price: 80 },
  { name: "🎱 Billiards", price: 80 }
];

let data = {
  totals: [0, 0, 0, 0, 0, 0],
  histories: [[], [], [], [], [], []],
  active: [null, null, null, null, null, null]
};

const roomsContainer = document.getElementById("rooms");

function money(value) {
  return Number(value || 0).toFixed(2);
}

function formatDuration(ms) {
  let seconds = Math.floor(ms / 1000);
  const hours = Math.floor(seconds / 3600);

  seconds %= 3600;

  const minutes = Math.floor(seconds / 60);
  seconds %= 60;

  return [hours, minutes, seconds]
    .map(n => String(n).padStart(2, "0"))
    .join(":");
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString("ar-EG");
}

function elapsed(room) {
  const session = data.active && data.active[room];

  return session
    ? Math.max(0, Date.now() - session.start)
    : 0;
}

// بناء الواجهة أولاً لضمان عدم ظهور الشاشة سوداء
roomData.forEach((room, index) => {
  const card = document.createElement("div");

  card.className = "room";

  card.innerHTML = `
    <h2>${room.name}</h2>

    <div class="price">
      ${room.price} جنيه / ساعة
    </div>

    <label class="start-label" for="startTime${index}">
      ⏰ حدد وقت بداية التايم (اختياري):
    </label>

    <input
      type="time"
      class="start-time"
      id="startTime${index}"
      step="1"
    >

    <div class="status" id="status${index}">
      الجلسة متوقفة
    </div>

    <div class="timer" id="timer${index}">
      00:00:00
    </div>

    <div class="buttons">
      <button
        class="start"
        id="start${index}"
        onclick="startTimer(${index})">
        ▶️ ابدأ التايم
      </button>

      <button
        class="stop"
        id="stop${index}"
        onclick="stopTimer(${index})"
        disabled>
        ⏹️ إنهاء التايم
      </button>
    </div>

    <div class="result" id="result${index}"></div>

    <div class="history">
      <div class="history-title">📋 سجل الجلسات</div>
      <div id="history${index}"></div>
    </div>
  `;

  roomsContainer.appendChild(card);
});

// حفظ البيانات في Firebase
function saveData() {
  dbRef.set(data).catch(error => {
    alert("تعذر حفظ البيانات في السحابة: " + error.message);
  });
}

// الاستماع للبيانات من السحابة وتحديث العرض
dbRef.on("value", (snapshot) => {
  const val = snapshot.val();
  if (val) {
    data.totals = val.totals || [0, 0, 0, 0, 0, 0];
    data.histories = val.histories ? val.histories.map(h => h || []) : [[], [], [], [], [], []];
    data.active = val.active || [null, null, null, null, null, null];
  }
  renderAll();
}, (error) => {
  console.error("Firebase Error: ", error);
  renderAll(); // عرض الواجهة محلياً حتى لو فشل الاتصال مؤقتاً
});

function startTimer(room) {
  if (data.active && data.active[room]) {
    alert("العداد شغال بالفعل في هذه الغرفة!");
    return;
  }

  const input = document.getElementById("startTime" + room);
  const now = new Date();
  let start = Date.now();

  if (input && input.value) {
    const parts = input.value.split(":").map(Number);
    const hours = parts[0];
    const minutes = parts[1];
    const seconds = parts[2] || 0;

    if (
      !Number.isInteger(hours) ||
      !Number.isInteger(minutes) ||
      !Number.isInteger(seconds) ||
      hours < 0 || hours > 23 ||
      minutes < 0 || minutes > 59 ||
      seconds < 0 || seconds > 59
    ) {
      alert("اختار توقيت صحيح!");
      return;
    }

    const selected = new Date(now);
    selected.setHours(hours, minutes, seconds, 0);

    start = selected.getTime();

    if (start > Date.now()) {
      alert("وقت البداية مينفعش يكون في المستقبل!");
      return;
    }
  }

  if (!data.active) {
    data.active = [null, null, null, null, null, null];
  }

  data.active[room] = {
    start: start
  };

  saveData();
}

function stopTimer(room) {
  const session = data.active && data.active[room];

  if (!session || !session.start) {
    alert("برجاء التأكد من بدء التايم لهذه الغرفة أولاً!");
    return;
  }

  const end = Date.now();
  const duration = Math.max(0, end - session.start);
  const total = (duration / 3600000) * roomData[room].price;

  const record = {
    start: session.start,
    end: end,
    duration: duration,
    amount: total
  };

  if (!data.histories[room]) {
    data.histories[room] = [];
  }

  data.histories[room].unshift(record);
  data.totals[room] = (data.totals[room] || 0) + total;
  data.active[room] = null;

  saveData();
  renderAll();
}

function renderRoom(room) {
  const active = data.active && data.active[room];

  const startBtn = document.getElementById("start" + room);
  const stopBtn = document.getElementById("stop" + room);
  const timeInput = document.getElementById("startTime" + room);

  if (startBtn) startBtn.disabled = !!active;
  if (stopBtn) stopBtn.disabled = !active;
  if (timeInput) timeInput.disabled = !!active;

  const statusEl = document.getElementById("status" + room);
  if (statusEl) {
    statusEl.textContent = active ? "🟢 الجلسة شغالة الآن" : "الجلسة متوقفة";
  }

  const timerEl = document.getElementById("timer" + room);
  if (timerEl) {
    timerEl.textContent = active ? formatDuration(elapsed(room)) : "00:00:00";
  }

  const historyElement = document.getElementById("history" + room);
  if (!historyElement) return;

  historyElement.replaceChildren();

  const historyList = data.histories[room] || [];

  if (!historyList.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "لا توجد جلسات مسجلة حتى الآن.";
    historyElement.appendChild(empty);
    return;
  }

  historyList.forEach(record => {
    const item = document.createElement("div");
    item.className = "history-item";

    const lines = [
      "📅 " + formatDate(record.start),
      "▶️ البداية: " + new Date(record.start).toLocaleTimeString("ar-EG"),
      "⏹️ النهاية: " + new Date(record.end).toLocaleTimeString("ar-EG"),
      "⏳ المدة: " + formatDuration(record.duration),
      "💰 المبلغ: " + money(record.amount) + " جنيه"
    ];

    lines.forEach((line, i) => {
      if (i > 0) {
        item.appendChild(document.createElement("br"));
      }
      item.appendChild(document.createTextNode(line));
    });

    historyElement.appendChild(item);
  });
}

function updateTotal() {
  const sum = (data.totals || []).reduce((a, b) => a + b, 0);
  const grandTotalEl = document.getElementById("grandTotal");
  if (grandTotalEl) {
    grandTotalEl.textContent = money(sum);
  }
}

function updateTimers() {
  roomData.forEach((room, index) => {
    if (data.active && data.active[index]) {
      const timerEl = document.getElementById("timer" + index);
      if (timerEl) {
        timerEl.textContent = formatDuration(elapsed(index));
      }
    }
  });
}

function renderAll() {
  roomData.forEach((room, index) => {
    renderRoom(index);
  });

  updateTotal();
  updateTimers();
}

// تشغيل العدادات كل ثانية
setInterval(updateTimers, 1000);
</script>

</body>
</html>
