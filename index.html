
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 LEVEL UP 🎮</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  padding: 15px;
  color: #fff;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,0,0,.2), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,0,0,.15), transparent 35%),
    #050505;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 6vw, 48px);
  margin: 15px 0 25px;
  color: #ff0000;
  text-shadow: 0 0 15px #ff0000;
}

.room {
  background: rgba(20,20,20,.95);
  border: 1px solid #ff0000;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

.room h2 {
  font-size: 21px;
  margin-bottom: 12px;
}

.price {
  color: #ff7777;
  margin-bottom: 15px;
}

.timer {
  text-align: center;
  font-size: clamp(28px, 7vw, 40px);
  font-weight: bold;
  color: #00ff99;
  margin: 15px 0;
  direction: ltr;
  font-variant-numeric: tabular-nums;
}

.status {
  text-align: center;
  color: #aaa;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 12px 8px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #008f55;
}

.stop {
  background: #ff0000;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.result {
  margin-top: 14px;
  color: #00ff99;
  line-height: 1.9;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.history {
  margin-top: 18px;
  border-top: 1px solid #333;
  padding-top: 12px;
}

.history-title {
  color: #ff7777;
  margin-bottom: 12px;
  font-weight: bold;
}

.history-item {
  background: #1a1a1a;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 9px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.empty {
  color: #777;
  font-size: 14px;
}

.total-box {
  background: #111;
  border: 2px solid #ff0000;
  padding: 20px 10px;
  border-radius: 15px;
  text-align: center;
  font-size: 22px;
  color: #00ff99;
  font-weight: bold;
  margin: 20px 0;
}

.total-box small {
  display: block;
  color: #aaa;
  font-size: 12px;
  font-weight: normal;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🎮 LEVEL UP 🎮</h1>

<div id="rooms"></div>

<div class="total-box">
  💰 إجمالي الأرباح
  <div><span id="grandTotal">0.00</span> جنيه</div>
  <small>إجمالي الجلسات المسجلة والمكتملة</small>
</div>

<script>
const roomData = [
  { name: "🎮 Room 1", price: 100 },
  { name: "🎮 Room 2", price: 100 },
  { name: "🎮 Room 3", price: 120 },
  { name: "🎮 Room 4", price: 200 },
  { name: "🎮 Room 5", price: 80 },
  { name: "🎱 Billiards", price: 80 }
];

const STORAGE_KEY = "levelUpDataV2";

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (
      saved &&
      Array.isArray(saved.totals) &&
      saved.totals.length === roomData.length &&
      Array.isArray(saved.histories) &&
      saved.histories.length === roomData.length &&
      Array.isArray(saved.active) &&
      saved.active.length === roomData.length
    ) {
      return saved;
    }
  } catch (error) {}

  return {
    totals: [0, 0, 0, 0, 0, 0],
    histories: [[], [], [], [], [], []],
    active: [null, null, null, null, null, null]
  };
}

let data = loadData();

const roomsContainer = document.getElementById("rooms");

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    alert("تعذر حفظ البيانات. تأكد من مساحة التخزين في المتصفح.");
  }
}

function money(value) {
  return Number(value).toFixed(2);
}

function formatDuration(ms) {
  let seconds = Math.floor(ms / 1000);
  const hours = Math.floor(seconds / 3600);

  seconds %= 3600;

  const minutes = Math.floor(seconds / 60);
  seconds %= 60;

  return [hours, minutes, seconds]
    .map(n => String(n).padStart(2, "0"))
    .join(":");
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString("ar-EG");
}

function elapsed(room) {
  const session = data.active[room];

  return session
    ? Math.max(0, Date.now() - session.start)
    : 0;
}

roomData.forEach((room, index) => {
  const card = document.createElement("div");

  card.className = "room";

  card.innerHTML = `
    <h2>${room.name}</h2>

    <div class="price">
      ${room.price} جنيه / ساعة
    </div>

    <div class="status" id="status${index}">
      الجلسة متوقفة
    </div>

    <div class="timer" id="timer${index}">
      00:00:00
    </div>

    <div class="buttons">
      <button
        class="start"
        id="start${index}"
        onclick="startTimer(${index})">
        ▶️ ابدأ التايم
      </button>

      <button
        class="stop"
        id="stop${index}"
        onclick="stopTimer(${index})"
        disabled>
        ⏹️ إنهاء التايم
      </button>
    </div>

    <div class="result" id="result${index}"></div>

    <div class="history">
      <div class="history-title">📋 سجل الجلسات</div>
      <div id="history${index}"></div>
    </div>
  `;

  roomsContainer.appendChild(card);
});

function startTimer(room) {
  if (data.active[room]) {
    alert("العداد شغال بالفعل في هذه الغرفة!");
    return;
  }

  data.active[room] = {
    start: Date.now()
  };

  saveData();
  renderRoom(room);

  document.getElementById("result" + room).textContent =
    "▶️ بدأت الجلسة بنجاح.";
}

function stopTimer(room) {
  const session = data.active[room];

  if (!session) {
    alert("ابدأ التايم الأول!");
    return;
  }

  const end = Date.now();
  const duration = Math.max(0, end - session.start);
  const total = duration / 3600000 * roomData[room].price;

  const record = {
    start: session.start,
    end: end,
    duration: duration,
    amount: total
  };

  data.histories[room].unshift(record);
  data.totals[room] += total;
  data.active[room] = null;

  saveData();
  renderRoom(room);
  updateTotal();

  document.getElementById("result" + room).textContent =
    `⏳ المدة: ${formatDuration(duration)} | 💰 الحساب: ${money(total)} جنيه`;
}

function renderRoom(room) {
  const active = data.active[room];

  document.getElementById("start" + room).disabled = !!active;
  document.getElementById("stop" + room).disabled = !active;

  document.getElementById("status" + room).textContent =
    active ? "🟢 الجلسة شغالة الآن" : "الجلسة متوقفة";

  document.getElementById("timer" + room).textContent =
    active ? formatDuration(elapsed(room)) : "00:00:00";

  const historyElement =
    document.getElementById("history" + room);

  historyElement.replaceChildren();

  if (!data.histories[room].length) {
    const empty = document.createElement("div");

    empty.className = "empty";
    empty.textContent = "لا توجد جلسات مسجلة حتى الآن.";

    historyElement.appendChild(empty);
    return;
  }

  data.histories[room].forEach(record => {
    const item = document.createElement("div");

    item.className = "history-item";

    const lines = [
      "📅 " + formatDate(record.start),
      "▶️ البداية: " +
        new Date(record.start).toLocaleTimeString("ar-EG"),
      "⏹️ النهاية: " +
        new Date(record.end).toLocaleTimeString("ar-EG"),
      "⏳ المدة: " + formatDuration(record.duration),
      "💰 المبلغ: " + money(record.amount) + " جنيه"
    ];

    lines.forEach((line, i) => {
      if (i > 0) {
        item.appendChild(document.createElement("br"));
      }

      item.appendChild(document.createTextNode(line));
    });

    historyElement.appendChild(item);
  });
}

function updateTotal() {
  const sum = data.totals.reduce((a, b) => a + b, 0);

  document.getElementById("grandTotal").textContent =
    money(sum);
}

function updateTimers() {
  roomData.forEach((room, index) => {
    if (data.active[index]) {
      document.getElementById("timer" + index).textContent =
        formatDuration(elapsed(index));
    }
  });
}

function renderAll() {
  roomData.forEach((room, index) => {
    renderRoom(index);
  });

  updateTotal();
  updateTimers();
}

renderAll();

setInterval(updateTimers, 1000);
</script>

</body>
</html>
