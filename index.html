<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEVEL UP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,sans-serif;
padding:20px;
color:white;
min-height:100vh;
overflow-x:hidden;
background:
radial-gradient(circle at 20% 20%, rgba(255,0,0,.25), transparent 30%),
radial-gradient(circle at 80% 30%, rgba(255,60,60,.2), transparent 35%),
radial-gradient(circle at 50% 80%, rgba(255,0,0,.2), transparent 40%),
#050505;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(
90deg,
transparent 49%,
rgba(255,0,0,.08) 50%,
transparent 51%
),
linear-gradient(
transparent 49%,
rgba(255,0,0,.08) 50%,
transparent 51%
);

background-size:60px 60px;
animation:gridMove 15s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{
transform:translateY(0);
}
to{
transform:translateY(60px);
}
}

h1{
text-align:center;
font-size:60px;
margin-bottom:30px;
color:#ff0000;
letter-spacing:5px;
text-shadow:
0 0 10px #ff0000,
0 0 20px #ff0000,
0 0 40px #ff0000,
0 0 80px #ff0000;
}

.container{
max-width:1200px;
margin:auto;
}

.room{
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
border:1px solid rgba(255,0,0,.5);
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:
0 0 15px rgba(255,0,0,.4);
}

.room:hover{
transform:translateY(-3px);
transition:.3s;
box-shadow:
0 0 25px rgba(255,0,0,.9);
}

.room h2{
margin-bottom:15px;
color:white;
}

.inputs{
display:flex;
flex-wrap:wrap;
gap:10px;
align-items:center;
}

input{
padding:10px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#ff0000;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

button:hover{
background:#cc0000;
box-shadow:
0 0 10px #ff0000,
0 0 20px #ff0000;
}

.result{
margin-top:15px;
font-size:18px;
color:#00ff99;
}

.game-icon{
display:inline-block;
font-size:28px;
margin-left:8px;
animation:gameGlow 1.5s infinite alternate;
}

.billiards-icon{
display:inline-block;
font-size:28px;
margin-left:8px;
animation:billiardsGlow 1.5s infinite alternate;
}

@keyframes gameGlow{

from{
filter:
drop-shadow(0 0 5px #ff0000);
}

to{
filter:
drop-shadow(0 0 15px #ff0000)
drop-shadow(0 0 30px #ff0000);
}

}

@keyframes billiardsGlow{

from{
filter:
drop-shadow(0 0 5px #00ff99);
}

to{
filter:
drop-shadow(0 0 15px #00ff99)
drop-shadow(0 0 30px #00ff99);
}

}

.total-box{
margin-top:25px;
text-align:center;
padding:25px;
border-radius:15px;
font-size:28px;
font-weight:bold;
background:rgba(0,0,0,.7);
border:2px solid #ff0000;
color:#00ff99;

box-shadow:
0 0 20px rgba(255,0,0,.8);
}

</style>
</head>

<body>

<h1>🎮 LEVEL UP 🎮</h1>

<div class="container">

<div class="room">
<h2><span class="game-icon">🎮</span>Room 1 | 100 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open1">
قفل <input type="time" id="close1">
<button onclick="calculate(1,100)">احسب</button>
</div>
<div class="result" id="result1"></div>
</div>

<div class="room">
<h2><span class="game-icon">🎮</span>Room 2 | 100 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open2">
قفل <input type="time" id="close2">
<button onclick="calculate(2,100)">احسب</button>
</div>
<div class="result" id="result2"></div>
</div>

<div class="room">
<h2><span class="game-icon">🎮</span>Room 3 | 120 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open3">
قفل <input type="time" id="close3">
<button onclick="calculate(3,120)">احسب</button>
</div>
<div class="result" id="result3"></div>
</div>

<div class="room">
<h2><span class="game-icon">🎮</span>Room 4 | 200 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open4">
قفل <input type="time" id="close4">
<button onclick="calculate(4,200)">احسب</button>
</div>
<div class="result" id="result4"></div>
</div>

<div class="room">
<h2><span class="game-icon">🎮</span>Room 5 | 80 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open5">
قفل <input type="time" id="close5">
<button onclick="calculate(5,80)">احسب</button>
</div>
<div class="result" id="result5"></div>
</div>

<div class="room">
<h2><span class="billiards-icon">🎱</span>Billiards | 80 جنيه / ساعة</h2>
<div class="inputs">
فتح <input type="time" id="open6">
قفل <input type="time" id="close6">
<button onclick="calculate(6,80)">احسب</button>
</div>
<div class="result" id="result6"></div>
</div>

<div class="total-box">
إجمالي الأرباح :
<span id="grandTotal">0</span>
جنيه
</div>

</div>

<script>

let totals=[0,0,0,0,0,0];

function calculate(room,price){

let open=document.getElementById("open"+room).value;
let close=document.getElementById("close"+room).value;

if(!open || !close){
alert("اختر وقت الفتح والقفل");
return;
}

let start=new Date("2024-01-01 "+open);
let end=new Date("2024-01-01 "+close);

let hours=(end-start)/(1000*60*60);

if(hours<0){
hours+=24;
}

let total=hours*price;

totals[room-1]=total;

document.getElementById("result"+room).innerHTML=
`
عدد الساعات : ${hours.toFixed(2)} ساعة <br>
الإجمالي : ${total.toFixed(2)} جنيه
`;

updateTotal();
}

function updateTotal(){

let sum=totals.reduce((a,b)=>a+b,0);

document.getElementById("grandTotal").innerText=
sum.toFixed(2);

}

</script>

</body>
</html>
